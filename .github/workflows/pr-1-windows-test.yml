name: PR 1 Windows test package
on:
  push:
    branches: [build/pr-1-windows-test]
    paths: ['.github/workflows/pr-1-windows-test.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a570c3d6859866ec8ee478f598d25275661a9d3
          persist-credentials: false
      - name: Install xmake
        shell: pwsh
        run: |
          choco install xmake -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile Windows x64
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\xmake;C:\ProgramData\chocolatey\bin;$env:PATH"
          New-Item -ItemType Directory -Force C:\x,C:\c,C:\p | Out-Null
          $env:XMAKE_GLOBALDIR = 'C:\x'
          $env:XMAKE_PKG_CACHEDIR = 'C:\c'
          $env:XMAKE_PKG_INSTALLDIR = 'C:\p'
          $env:XMAKE_COLORTERM = 'nocolor'
          git config --global core.longpaths true
          $recipe = 'packages/libavif.lua'
          $original = [IO.File]::ReadAllText($recipe)
          $sourceUrl = 'https://codeload.github.com/AOMediaCodec/libavif/tar.gz/refs/tags/v$(version)'
          $archiveUrl = 'https://github.com/AOMediaCodec/libavif/archive/refs/tags/v$(version).tar.gz'
          if (!$original.Contains($sourceUrl)) { throw 'Unexpected libavif recipe' }
          [IO.File]::WriteAllText($recipe, $original.Replace($sourceUrl, $archiveUrl))
          try { ./tools/build.ps1 } catch {
            Get-ChildItem C:\c -Recurse -Filter install.txt -ErrorAction SilentlyContinue | Where-Object FullName -like '*installdir.failed*' | ForEach-Object {
              Write-Host $_.FullName
              Get-Content -LiteralPath $_.FullName -Tail 60
            }
            Get-ChildItem C:\c -Recurse -Filter merge_static_libs.cmake -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw
          } finally { [IO.File]::WriteAllText($recipe, $original) }
      - name: Assemble and validate a private test package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/XiaViolet/YsmBedrock/releases/download/v0.29.44/YsmBedrock-0.29.44.mcmod' -OutFile (Join-Path $env:RUNNER_TEMP 'base.mcmod')
          if ((Get-FileHash (Join-Path $env:RUNNER_TEMP 'base.mcmod') -Algorithm SHA256).Hash -ne 'f4a1855d5b04b9499527527ac215436502c465f6dc23bf613c549cc77c80ac1f') { throw 'Official release asset digest mismatch' }
          ./tools/package-localized.ps1 -BaseMod (Join-Path $env:RUNNER_TEMP 'base.mcmod') -OutputDirectory test-output
          $mod = Get-ChildItem test-output -Filter '*.mcmod'
          $zip = [IO.Compression.ZipFile]::OpenRead($mod.FullName)
          try {
            foreach ($file in @('manifest.json','YsmBedrock.dll','YsmLegacyV3.dll','models/ysm-magical-wine-fox.zip')) {
              if (!$zip.GetEntry($file)) { throw "Missing $file" }
            }
          } finally { $zip.Dispose() }
          Rename-Item -LiteralPath $mod.FullName -NewName 'YsmBedrock-0.29.44-PR1-test.mcmod'
          Remove-Item test-output/*-BedrockBoot.zip
          Get-FileHash test-output/*.mcmod | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: YsmBedrock-0.29.44-PR1-test
          path: test-output/*.mcmod
          if-no-files-found: error
          retention-days: 7
